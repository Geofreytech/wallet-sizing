spring.application.name=wallet-sizing

# 1. Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/wallet-sizing?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Updated Dialect for Hibernate 7
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. Disable Flyway for now (avoids the MySQL 5.5 version error)
spring.flyway.enabled=false

# 4. Server Port
server.port=8080

logging.level.org.springframework.security=DEBUG